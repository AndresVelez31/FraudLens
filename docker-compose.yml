# FraudLens: pipeline completo. Este archivo es la configuración para AWS; ver README.md.
#
#   AWS, EC2-A (Kafka + streaming):  docker compose --profile streaming up -d --build
#   AWS, EC2-B (Airflow + batch):    docker compose --profile batch up -d --build
#   Local (todo en una máquina):     docker compose -f docker-compose.yml -f compose.local.yml \
#                                      --profile streaming --profile batch up -d --build
#
# En AWS no hay llaves en ningún lado: boto3 y Spark (S3A) toman las credenciales del rol de la EC2 (fraudlens-ec2).
# En local, compose.local.yml agrega MinIO (como S3), DynamoDB Local y sus llaves de prueba.
name: fraudlens

x-env: &env
  AWS_REGION: ${AWS_REGION:-us-east-2}
  S3_BUCKET: ${S3_BUCKET:?define S3_BUCKET en .env}
  S3_ENDPOINT: ${S3_ENDPOINT:-}              # vacío = S3 real
  DYNAMODB_TABLE: ${DYNAMODB_TABLE:-alertas_fraude}
  DYNAMODB_ENDPOINT: ${DYNAMODB_ENDPOINT:-}  # vacío = DynamoDB real
  SNS_TOPIC_ARN: ${SNS_TOPIC_ARN:-}          # vacío = la alerta solo se registra en el log
  NOTIFICAR_CADA_SEGUNDOS: ${NOTIFICAR_CADA_SEGUNDOS:-300}   # como máximo un correo resumen cada 5 min
  NOTIFICAR_DESDE: ${NOTIFICAR_DESDE:-spark}   # spark (resumen desde el streaming) o lambda (Lambda notificadora, D3)
  GLUE_DATABASE: ${GLUE_DATABASE:-fraudlens}
  ATHENA_WORKGROUP: ${ATHENA_WORKGROUP:-fraudlens}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-1:29092,kafka-2:29092,kafka-3:29092}
  KAFKA_TOPIC: ${KAFKA_TOPIC:-transacciones}
  KAFKA_DLQ_TOPIC: ${KAFKA_DLQ_TOPIC:-transacciones_dlq}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_DB: ${POSTGRES_DB:-fraudlens}
  POSTGRES_USER: ${POSTGRES_USER:-fraudlens}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
  PII_HMAC_KEY: ${PII_HMAC_KEY:?define PII_HMAC_KEY en .env}
  RULE_VERSION: ${RULE_VERSION:-v1}
  REGLAS_ACTIVAS: ${REGLAS_ACTIVAS:-R1,R2,R3,R4}
  STARTING_OFFSETS: ${STARTING_OFFSETS:-earliest}
  SPARK_MASTER: ${SPARK_MASTER:-local[2]}
  N_CLIENTES: ${N_CLIENTES:-20000}
  CATALOGOS_ORIGEN: ${CATALOGOS_ORIGEN:-}
  ZONA_HORARIA: ${ZONA_HORARIA:-America/Bogota}
  N_COMERCIOS: ${N_COMERCIOS:-300}

x-spark: &spark-image
  build: {context: ., dockerfile: infra/docker/Dockerfile.spark}
  image: fraudlens-spark

x-airflow: &airflow-image   # cada servicio sabe construir su imagen: compose no intenta bajarla de un registro
  build: {context: ., dockerfile: infra/docker/Dockerfile.airflow}
  image: fraudlens-airflow

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.0
  profiles: ["streaming"]
  restart: unless-stopped
  deploy: {resources: {limits: {memory: 1g}}}
  environment: &kafka-env
    CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"       # 3 brokers + Spark caben en los 8 GB de una m7i-flex.large
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2            # con acks=all: tolera la caída de 1 broker sin perder datos
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"   # CP: antes indisponible que perder datos
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_LOG_RETENTION_HOURS: 168
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
    interval: 10s
    timeout: 10s
    retries: 12
    start_period: 20s

services:
  # ------------------------------------------------------------ perfil "streaming" (EC2-A)
  kafka-1:
    <<: *kafka
    hostname: kafka-1
    ports: ["9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
    volumes: [kafka-1:/var/lib/kafka/data]
  kafka-2:
    <<: *kafka
    hostname: kafka-2
    ports: ["9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://localhost:9094
    volumes: [kafka-2:/var/lib/kafka/data]
  kafka-3:
    <<: *kafka
    hostname: kafka-3
    ports: ["9095:9095"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:29092,EXTERNAL://:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://localhost:9095
    volumes: [kafka-3:/var/lib/kafka/data]

  kafka-init:   # crea los topics y termina
    image: confluentinc/cp-kafka:7.6.0
    profiles: ["streaming"]
    depends_on:
      kafka-1: {condition: service_healthy}
      kafka-2: {condition: service_healthy}
      kafka-3: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic transacciones --partitions 12 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=604800000
        kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic transacciones_dlq --partitions 3 --replication-factor 3 --config min.insync.replicas=2 --config retention.ms=2592000000
        kafka-topics --bootstrap-server kafka-1:29092 --list
    restart: "no"

  streaming:   # RF-05 a RF-09: Kafka -> Bronze/Silver, R1/R2/R3, DynamoDB y SNS
    <<: *spark-image
    profiles: ["streaming"]
    environment: *env
    command: python -m streaming.job
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    restart: unless-stopped
    deploy: {resources: {limits: {memory: 3g}}}

  producer:   # generador de transacciones: docker compose run --rm producer python -m producer.producer ...
    <<: *spark-image
    profiles: ["demo"]   # no arranca con `up`; `docker compose run producer` lo activa igual
    environment: *env
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    command: python -m producer.producer --rate 50 --duracion 120
    restart: "no"

  # ------------------------------------------------------------ perfil "batch" (EC2-B)
  postgres:
    image: postgres:16-alpine
    profiles: ["batch"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fraudlens}
      POSTGRES_USER: ${POSTGRES_USER:-fraudlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
    ports: ["127.0.0.1:5432:5432"]   # solo desde la propia máquina
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fraudlens}"]
      interval: 5s
      retries: 12

  setup:   # siembra PostgreSQL y deja la lista de riesgo v1 en landing (idempotente). En local también crea bucket y tabla.
    <<: *spark-image
    profiles: ["batch"]
    environment: *env
    depends_on:
      postgres: {condition: service_healthy}
    command:
      - bash
      - -c
      - |
        set -e
        if [ -n "$${S3_ENDPOINT}" ]; then   # solo en local: MinIO y DynamoDB Local tardan unos segundos en arrancar
          ok=0
          for i in $$(seq 1 30); do python infra/aws/crear_recursos.py --solo s3 dynamodb && { ok=1; break; }; sleep 3; done
          [ "$$ok" = 1 ]
        fi
        # En AWS el bucket, la tabla y el topic ya existen (se crean una vez desde la consola o con crear_recursos.py --todo).
        if [ -n "$${CATALOGOS_ORIGEN}" ]; then
          # Datos reales: los catálogos de IEEE-CIS que dejó scripts/preparar_ieee.py en el lake reemplazan a los
          # sintéticos. La lista de riesgo (riesgo_v100.csv) ya está en landing; no se sube la sintética.
          python -m producer.catalogo --postgres --desde-csv "$${CATALOGOS_ORIGEN}" --reemplazar
          exit 0
        fi
        python -m producer.catalogo --postgres --clientes $${N_CLIENTES:-20000} --comercios $${N_COMERCIOS:-300} &&
        mkdir -p /tmp/lr && python -m producer.catalogo --clientes 0 --lista-riesgo 1 --destino /tmp/lr &&
        python - <<'PY'
        import os, boto3
        s3 = boto3.client("s3", endpoint_url=os.environ.get("S3_ENDPOINT") or None, region_name=os.environ["AWS_REGION"])
        s3.upload_file("/tmp/lr/riesgo_v001.csv", os.environ["S3_BUCKET"], "landing/listas_riesgo/riesgo_v001.csv")
        print("lista de riesgo v1 en landing/listas_riesgo/")
        PY
    restart: "no"

  api:   # RF-17: GET /alertas (pasa a API Gateway + Lambda en la tarea G2)
    build: {context: ., dockerfile: infra/docker/Dockerfile.api}
    profiles: ["batch"]
    environment: *env
    ports: ["8080:8000"]
    restart: unless-stopped

  airflow-init:
    <<: *airflow-image
    profiles: ["batch"]
    environment: &airflow-env
      <<: *env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-fraudlens}:${POSTGRES_PASSWORD}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-fraudlens-local-no-usar-en-produccion}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/fraudlens/dags
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      FRAUDLENS_HOME: /opt/fraudlens
    depends_on:
      postgres: {condition: service_healthy}
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname Fraud --lastname Lens --role Admin --email admin@fraudlens.local || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-image
    profiles: ["batch"]
    environment: *airflow-env
    command: airflow webserver
    ports: ["8081:8080"]
    volumes: ["./:/opt/fraudlens"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    restart: unless-stopped
    deploy: {resources: {limits: {memory: 1500m}}}

  airflow-scheduler:
    <<: *airflow-image
    profiles: ["batch"]
    environment: *airflow-env
    command: airflow scheduler
    volumes: ["./:/opt/fraudlens"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      setup: {condition: service_completed_successfully}
    restart: unless-stopped
    deploy: {resources: {limits: {memory: 4g}}}

volumes:
  kafka-1:
  kafka-2:
  kafka-3:
  postgres:
